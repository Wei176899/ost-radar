name: Update & Deploy

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect data
        run: python -m tracker
      - name: Commit data
        run: |
          git config user.name "ost-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): update $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && break
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('site/data/items.json', 'site/data/meta.json', 'site/data/news.json', 'data/state.json')]"
          git push

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore thumbnail cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/img
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - name: Build thumbnails
        run: |
          pip install -r requirements.txt
          python -m tracker.thumbs
      - name: Save thumbnail cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/img
          key: thumbs-${{ github.run_id }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
