name: 更新資料並部署網站

on:
  schedule:
    - cron: "0 22 */3 * *"   # 每 3 天，台北時間早上 6 點（UTC 22:00）
  workflow_dispatch:          # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

# 預設不給任何權限，各 job 只開需要的
permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # 只用來把新資料 commit 回 main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 執行追蹤器
        run: python -m tracker
      - name: 提交資料
        run: |
          git config user.name "ost-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/state.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 執行期間 main 可能有新 commit（例如改網站），先同步再推送
          git pull --rebase origin main
          git push

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write           # 發布到 GitHub Pages
      id-token: write        # Pages 部署驗證用（OIDC），不是金鑰
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
