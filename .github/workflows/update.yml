name: Update & Deploy

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect data
        run: python -m tracker
      - name: Commit data
        run: |
          git config user.name "ost-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): update $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && break
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('site/data/items.json', 'site/data/meta.json', 'site/data/news.json', 'data/state.json')]"
          git push

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore thumbnail cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/img
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - name: Build thumbnails
        run: |
          pip install -r requirements.txt
          python -m tracker.thumbs
      - name: Save thumbnail cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/img
          key: thumbs-${{ github.run_id }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
